<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>404 - Page Not Found</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;
    }

    .error-container {
        background: white;
        width: 450px;
        padding: 50px 40px;
        text-align: center;

        border-radius: 12px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
    }

    .error-code {
        font-size: 80px;
        font-weight: bold;
        color: #007bff;
    }

    h1 {
        margin: 15px 0;
        color: #333;
    }

    p {
        color: #666;
        margin-bottom: 30px;
        line-height: 1.6;
    }

    .home-btn {
        display: inline-block;
        padding: 12px 25px;

        background: #007bff;
        color: white;

        text-decoration: none;
        border-radius: 6px;
    }

    .home-btn:hover {
        background: #0056b3;
    }
</style>


</head>

<body>

<div class="error-container">

```
<div class="error-code">404</div>

<h1>Page Not Found</h1>

<p>
    Sorry, the page you are looking for does not exist.
</p>

<a href="/home" class="home-btn">Go to Home</a>


</div>

</body>
</html>
